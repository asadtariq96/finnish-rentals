<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;

    --imm:#22c55e; --vac:#f59e0b; --agr:#8b5cf6;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:12.5px}
  .layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 53px)}
  aside{padding:14px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 53px);position:sticky;top:0}
  main{padding:16px 20px;overflow:auto}
  .fgroup{margin-bottom:14px}
  .fgroup>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:600}
  input[type=text],select{width:100%;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:13px}
  input[type=text]:focus,select:focus{outline:none;border-color:var(--accent)}
  .range{display:flex;gap:8px;align-items:center}
  .range input{width:100%;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:13px}
  .range span{color:var(--muted);font-size:12px}
  .checks{display:flex;flex-direction:column;gap:4px}
  .checks label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;padding:2px 0}
  .checks input{accent-color:var(--accent)}
  .chkcount{color:var(--muted);font-size:11.5px;margin-left:auto}
  .btn{width:100%;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  .matchline{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  #mapwrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px;background:#14161b}
  #map{height:360px;width:100%;background:#14161b}
  #divider{height:10px;background:var(--panel2);border-top:1px solid var(--line);cursor:row-resize;display:flex;align-items:center;justify-content:center;user-select:none;color:var(--muted);font-size:10px;letter-spacing:3px}
  #divider:hover{background:var(--line);color:var(--txt)}
  #divider span{pointer-events:none}
  .tblwrap{max-height:calc(100vh - 500px);min-height:240px;overflow:auto;border-radius:8px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px}
  thead{position:sticky;top:0;z-index:2}
  thead th{background:var(--panel2);text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
  thead th:hover{color:var(--txt)}
  thead th .arrow{color:var(--accent)}
  tbody td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:var(--panel2)}
  tbody tr{cursor:pointer}
  .thumb{width:64px;height:48px;object-fit:cover;border-radius:5px;background:#000;display:block}
  .rent{font-weight:650}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .tag.imm{background:rgba(34,197,94,.15);color:var(--imm)}
  .tag.vac{background:rgba(245,158,11,.15);color:var(--vac)}
  .tag.agr{background:rgba(139,92,246,.15);color:var(--agr)}
  .tag.newb{background:rgba(79,140,255,.15);color:var(--accent)}
  .muted{color:var(--muted)}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .leaflet-popup-tip{background:var(--panel2)}
  a{color:var(--accent);text-decoration:none}
</style>
</head>

const IMG = a => a.mainImageUri ? ('https:' + a.mainImageUri.replace('{imageParameters}','400x300,q85,f=webp')) : '';
const URL = a => 'https://www.vuokraovi.com/kohde/' + a.friendlyId;
const district = a => { let s=(a.addressLine2||'').trim().replace(/[, ]*ESPOO$/i,'').replace(/[, ]*Espoo$/i,'').trim(); return s||'(unknown)'; };
const landlord = a => (a.office && a.office.name) || a.privateLessorName || 'Yksityinen';
const avail = a => (a.rentalAvailability && a.rentalAvailability.type) || 'ON_AGREEMENT';
const sqm = a => a.area ? Math.round(a.searchRent/a.area*10)/10 : null;
const fmt = n => n==null ? '–' : n.toLocaleString('fi-FI',{maximumFractionDigits:1});
const eur = n => n==null ? '–' : Math.round(n).toLocaleString('fi-FI') + ' €';
const roomLabel = {THREE_ROOMS:'3 rooms',FOUR_ROOMS:'4 rooms',FIVE_ROOMS:'5 rooms',MORE_THAN_FIVE_ROOMS:'5+ rooms',TWO_ROOMS:'2 rooms',ONE_ROOM:'1 room'};
const availLabel = {IMMEDIATELY:'Immediately',VACANCY:'Vacancy',ON_AGREEMENT:'On agmt'};
const availColor = {IMMEDIATELY:'#22c55e',VACANCY:'#f59e0b',ON_AGREEMENT:'#8b5cf6'};

const rows = DATA.announcements.map(a => Object.assign({}, a, {_district:district(a),_landlord:landlord(a),_avail:avail(a),_sqm:sqm(a)}));

// build filter option lists
function buildChecks(id, field, lbl){ const c={}; rows.forEach(r=>c[r[field]]=(c[r[field]]||0)+1);
  document.getElementById(id).innerHTML = Object.keys(c).sort().map(k=>`<label><input type="checkbox" value="${k}" checked>${lbl(k)}<span class="chkcount">${c[k]}</span></label>`).join(''); }
function buildSelect(id, field, lbl){ const c={}; rows.forEach(r=>c[r[field]]=(c[r[field]]||0)+1);
  document.getElementById(id).innerHTML = Object.keys(c).sort((a,b)=>c[b]-c[a]).map(k=>`<option value="${k.replace(/"/g,'&quot;')}">${lbl(k)} (${c[k]})</option>`).join('');
  document.querySelectorAll('#'+id+' option').forEach(o=>o.selected=true); }
buildChecks('rooms','roomCount',r=>roomLabel[r]||r);
buildChecks('avail','_avail',r=>availLabel[r]||r);
buildSelect('landlord','_landlord',x=>x);
buildSelect('district','_district',x=>x);

const state = {q:'',rentMin:null,rentMax:null,areaMin:null,areaMax:null,
  rooms:new Set(),avail:new Set(),newb:false,landlord:new Set(),district:new Set()};
const parseNum = id => { const v=document.getElementById(id).value; return v===''?null:parseFloat(v); };
function syncState(){
  state.rooms=new Set([...document.querySelectorAll('#rooms input:checked')].map(i=>i.value));
  state.avail=new Set([...document.querySelectorAll('#avail input:checked')].map(i=>i.value));
  state.newb=document.getElementById('newb').checked;
  state.landlord=new Set([...document.getElementById('landlord').selectedOptions].map(o=>o.value));
  state.district=new Set([...document.getElementById('district').selectedOptions].map(o=>o.value));
  state.rentMin=parseNum('rentMin'); state.rentMax=parseNum('rentMax');
  state.areaMin=parseNum('areaMin'); state.areaMax=parseNum('areaMax');
  state.q=document.getElementById('q').value.toLowerCase();
}

// table column defs
const cols = [
  {k:'_img',    t:'',                val:null},
  {k:'location',t:'Address',         val:r=>(r.location||'').toLowerCase()},
  {k:'_district',t:'District',       val:r=>(r._district||'').toLowerCase()},
  {k:'roomStructure',t:'Rooms',      val:r=>(r.roomStructure||'').toLowerCase()},
  {k:'area',    t:'m²',              val:r=>r.area,               num:1},
  {k:'constructionFinishedYear',t:'Year',val:r=>r.constructionFinishedYear||-1,num:1},
  {k:'floorLevel',t:'Floor',         val:r=>r.floorLevel||-1,      num:1},
  {k:'searchRent',t:'Rent',          val:r=>r.searchRent,          num:1},
  {k:'_sqm',    t:'€/m²',            val:r=>r._sqm==null?-Infinity:r._sqm,num:1},
  {k:'_avail',  t:'Avail',           val:r=>(availLabel[r._avail]||'').toLowerCase()},
  {k:'_landlord',t:'Landlord',       val:r=>(r._landlord||'').toLowerCase()},
];
let sortIdx = 7, sortDir = 'asc';  // default: Rent asc

function filtered(){
  syncState();
  const q=state.q;
  let list = rows.filter(r=>{
    if(q && !(r.location+' '+r._landlord+' '+r._district).toLowerCase().includes(q)) return false;
    if(state.rentMin!=null && r.searchRent<state.rentMin) return false;
    if(state.rentMax!=null && r.searchRent>state.rentMax) return false;
    if(state.areaMin!=null && r.area<state.areaMin) return false;
    if(state.areaMax!=null && r.area>state.areaMax) return false;
    if(state.rooms.size && !state.rooms.has(r.roomCount)) return false;
    if(state.avail.size && !state.avail.has(r._avail)) return false;
    if(state.newb && !r.newBuilding) return false;
    if(state.landlord.size && !state.landlord.has(r._landlord)) return false;
    if(state.district.size && !state.district.has(r._district)) return false;
    return true;
  });
  const c = cols[sortIdx];
  if(c.val){
    const dir = sortDir==='asc'?1:-1;
    list.sort((a,b)=>{ const va=c.val(a), vb=c.val(b);
      if(c.num) return (va-vb)*dir;
      return String(va).localeCompare(String(vb),'fi')*dir; });
  }
  return list;
}

// map
let map=null, markers=L.layerGroup();
function renderMap(list){
  if(!map){
    map=L.map('map').setView([60.205,24.66],11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  }
  markers.clearLayers();
  const pts=list.filter(r=>r.latitude&&r.longitude);
  pts.forEach(r=>{
    const m=L.circleMarker([r.latitude,r.longitude],{radius:7,color:'#0f1115',weight:1,fillColor:availColor[r._avail],fillOpacity:.85});
    m.bindPopup(`<b>${r.location}</b><br>${r.roomStructure} · ${fmt(r.area)} m² · <b>${eur(r.searchRent)}</b><br>${availLabel[r._avail]}${r.rentalAvailability&&r.rentalAvailability.vacancyDate?' · '+r.rentalAvailability.vacancyDate:''}<br><a href="${URL(r)}" target="_blank">open listing →</a>`);
    markers.addLayer(m);
  });
  markers.addTo(map);
  if(pts.length) map.fitBounds(L.latLngBounds(pts.map(r=>[r.latitude,r.longitude])).pad(0.1));
}

// table
function renderTable(list){
  document.getElementById('thead').innerHTML = cols.map((c,i)=>{
    const arrow = i===sortIdx ? (sortDir==='asc'?' ▲':' ▼') : '';
    return `<th data-i="${i}">${c.t}<span class="arrow">${arrow}</span></th>`;
  }).join('');
  document.getElementById('tbody').innerHTML = list.map(r=>{
    const tag=r._avail==='IMMEDIATELY'?'imm':r._avail==='VACANCY'?'vac':'agr';
    const nb=r.newBuilding?' <span class="tag newb">new</span>':'';
    return `<tr onclick="window.open('${URL(r)}','_blank')">
      <td>${IMG(r)?`<img class="thumb" loading="lazy" src="${IMG(r)}">`:'<div class="thumb"></div>'}</td>
      <td><b>${r.location}</b></td>
      <td class="muted">${r._district}</td>
      <td>${r.roomStructure}${nb}</td>
      <td>${fmt(r.area)}</td>
      <td>${r.constructionFinishedYear||'–'}</td>
      <td>${r.floorLevel||'–'}</td>
      <td class="rent">${eur(r.searchRent)}</td>
      <td>${fmt(r._sqm)}</td>
      <td><span class="tag ${tag}">${availLabel[r._avail]}</span></td>
      <td class="muted">${r._landlord}</td></tr>`;
  }).join('') || '<tr><td colspan="11" class="empty">No listings match the current filters.</td></tr>';
}

// header click -> sort
document.getElementById('thead').addEventListener('click', e=>{
  const th=e.target.closest('th'); if(!th) return;
  const i=+th.dataset.i; if(i===0) return;          // image col not sortable
  if(i===sortIdx) sortDir = sortDir==='asc'?'desc':'asc';
  else { sortIdx=i; sortDir=cols[i].num?'asc':'asc'; }
  render();
});

// draggable divider: drag up/down to resize the map
const mapEl=document.getElementById('map'), divider=document.getElementById('divider');
let dragging=false, startY=0, startH=0;
divider.addEventListener('mousedown', e=>{
  dragging=true; startY=e.clientY; startH=mapEl.offsetHeight;
  e.preventDefault(); document.body.style.userSelect='none'; document.body.style.cursor='row-resize';
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const h=Math.min(Math.max(startH + (e.clientY-startY), 140), window.innerHeight-430);
  mapEl.style.height=h+'px';
  if(map) map.invalidateSize();
});
window.addEventListener('mouseup', ()=>{ dragging=false; document.body.style.userSelect=''; document.body.style.cursor=''; });
divider.addEventListener('dblclick', ()=>{ mapEl.style.height='360px'; if(map) map.invalidateSize(); });

function render(){
  const list=filtered();
  renderMap(list);
  renderTable(list);
  document.getElementById('matchline').textContent = `${list.length} / ${rows.length} listings`;
  document.getElementById('fetched').textContent='fetched '+DATA.fetchedAt.replace('T',' ').replace('Z',' UTC');
}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',render));
document.getElementById('reset').addEventListener('click',()=>{
  ['q','rentMin','rentMax','areaMin','areaMax'].forEach(id=>document.getElementById(id).value='');
  document.querySelectorAll('#rooms input,#avail input').forEach(i=>i.checked=true);
  document.getElementById('newb').checked=false;
  ['landlord','district'].forEach(id=>document.querySelectorAll('#'+id+' option').forEach(o=>o.selected=true));
  render();
});
render();
</script>
</body>
</html>
